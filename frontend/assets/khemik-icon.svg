<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Khemik</title>
  <description id="description">Logotipo de Khemik sobre un fondo azul con detalle naranja.</description>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18375e"/>
      <stop offset="1" stop-color="#183b66"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#08111f" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="858" cy="188" r="152" fill="#2a7dbe" opacity=".28"/>
  <circle cx="104" cy="912" r="178" fill="#eb6731" opacity=".22"/>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="150" fill="#fff" stroke="#d2e0ee" stroke-width="4"/>
  </g>

  <image href="khemik-original.png" x="142" y="248" width="740" height="512" preserveAspectRatio="xMidYMid meet"/>
</svg>
